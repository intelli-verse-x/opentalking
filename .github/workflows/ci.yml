name: CI

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev]"
          pip install pytest-socket==0.7.0

      - name: Lint
        run: >
          ruff check
          opentalking/core
          opentalking/events
          opentalking/avatar
          apps/api
          apps/unified
          apps/cli
          tests

      - name: Type Check
        run: >
          mypy
          opentalking/core
          opentalking/events
          opentalking/avatar
          apps/api
          apps/unified
          apps/cli
          --ignore-missing-imports

      - name: Test
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          OPENAI_API_KEY: ""
          DASHSCOPE_API_KEY: ""
          MINIMAX_API_KEY: ""
          ELEVENLABS_API_KEY: ""
        run: pytest apps/api/tests tests --disable-socket --allow-hosts=127.0.0.1,localhost,::1 --allow-unix-socket

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Python Package
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*

      - name: Check Package Contents
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))

          with zipfile.ZipFile(wheel) as archive:
              wheel_tests = [
                  name for name in archive.namelist()
                  if name.startswith("apps/api/tests/")
              ]

          with tarfile.open(sdist) as archive:
              sdist_tests = [
                  name for name in archive.getnames()
                  if "/apps/api/tests/" in name
              ]

          if wheel_tests or sdist_tests:
              raise SystemExit(
                  "Package artifacts must not include apps/api/tests files."
              )
          PY

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Policy and UI Helper Tests
        run: npm test

      - name: Build
        run: npm run build

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev]"
          pip install -r docs/requirements.txt

      - name: Build Docs
        run: python -m mkdocs build --strict --clean
